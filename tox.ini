[tox]
requires = tox>=4
env_list = py{39,310,311,312,313,314}

[testenv]
# The package's install_requires pull in native modules (mysqlclient, psycopg2,
# pyodbc) that require system libraries. The test suite only touches the
# standard library plus requests, so skip installing the package dependencies
# and run the tests against the source tree instead.
skip_install = true
deps =
    pytest>=8
    requests
commands =
    python -m pytest {posargs}

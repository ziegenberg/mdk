name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-tests.txt
            pyproject.toml

      # Test deps are installed normally (they are lightweight). The package
      # itself is installed with --no-deps to validate that it builds from
      # pyproject.toml, while avoiding its native dependencies (mysqlclient,
      # psycopg2, pyodbc) which require system libraries.
      - name: Install test dependencies
        run: python -m pip install -r requirements-tests.txt

      - name: Install the package (building the wheel, without its deps)
        run: python -m pip install --no-deps .

      - name: Run the test suite
        run: python -m pytest
